name: Release and Build
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4.2.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Login to Docker Hub
        uses: yc-actions/yc-cr-login@v3
        with:
          registry: cr.yandex
          yc-sa-json-credentials: ${{ secrets.YC_SA_CR_IMAGES_PUSHER }}
      - name: Build, tag, and push image to Yandex Cloud Container Registry
        env:
          CR_REGISTRY: crp00000000000000000
          CR_REPOSITORY: my-cr-repo
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build --pull \
            --build-arg GITHUB_SHA \
            --build-arg TAG \
            -t ${{ github.event.repository.name }}:latest
          docker push cr.yandex/$CR_REGISTRY/${{ github.event.repository.name }}:$IMAGE_TAG --all-tags

